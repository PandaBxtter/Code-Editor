name: Build APK

on:
  push:
    branches:
      - main  # Change this to your main branch, if different.

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Set up JDK 8 (required for building Android projects)
      - name: Set up JDK 8
        uses: actions/setup-java@v1
        with:
          java-version: '8'

      # Step 3: Set up Android SDK and build tools
      - name: Set up Android SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '29'  # Target Android version
          arch: 'x86_64'

      # Step 4: Build the APK with Gradle
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      # Step 5: Upload the generated APK as an artifact
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v2
        with:
          name: myapp-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
